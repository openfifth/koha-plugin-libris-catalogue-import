name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 6 1,15 * *"

env:
  # Only needs stock Koha import-batch APIs, so test against the community tree.
  KOHA_REPO: https://git.koha-community.org/Koha-community/Koha.git
  KOHA_BRANCH: 25.11.x
  KOHA_IMAGE: "25.11"

jobs:
  guard:
    name: Skip duplicate release run
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout plugin code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect release-tag companion push
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          # `npm run release:*` pushes the version-bump commit on main and its
          # release tag together (`--follow-tags`). GitHub fires a separate
          # push event per ref updated, so without this guard the same commit
          # gets tested twice: once for the branch push, once for the tag
          # push. Skip the branch-push copy when this exact commit already
          # carries a release tag; the tag-triggered run (a separate event,
          # with github.ref pointing at the tag) still runs unaffected.
          if [ "$EVENT_NAME" = "push" ] && [[ "$EVENT_REF" == refs/heads/* ]] && git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Commit already covered by a tag-triggered run; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  unit_tests:
    name: Run unit tests
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout plugin code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up environment variables
        run: |
          IFS='/' read -r -a parts <<< "$GITHUB_REPOSITORY"
          GITHUB_REPO="${parts[1]}"
          echo "GITHUB_REPO=$GITHUB_REPO" >> $GITHUB_ENV
          echo "PLUGINS_DIR=$(pwd)/.." >> $GITHUB_ENV
          echo "SYNC_REPO=$(pwd)/../kohaclone" >> $GITHUB_ENV

      - name: Check out Koha
        run: |
          cd ..
          git clone --branch "$KOHA_BRANCH" --single-branch --depth 1 "$KOHA_REPO" kohaclone

      - name: Install koha-testing-docker
        run: |
          cd ..
          git clone https://gitlab.com/koha-community/koha-testing-docker.git
          cd koha-testing-docker
          cp env/defaults.env .env
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Launch KTD instance with plugins support
        run: |
          sudo sysctl -w vm.max_map_count=262144
          cd ../koha-testing-docker
          export LOCAL_USER_ID=$(id -u)
          export KTD_HOME=$(pwd)
          export SKIP_L10N=yes
          ktd --name template --plugins up -d

      - name: Wait for KTD to be ready
        run: |
          export KTD_HOME=$(pwd)/../koha-testing-docker
          ktd --name template --wait-ready 240

      - name: Install plugins in KTD
        run: |
          export KTD_HOME=$(pwd)/../koha-testing-docker
          ktd --name template --shell --run "cd /kohadevbox/koha && perl misc/devel/install_plugins.pl"

      - name: Run plugin tests
        run: |
          export KTD_HOME=$(pwd)/../koha-testing-docker
          ktd --name template --shell --run "
            cd /kohadevbox/plugins/$GITHUB_REPO &&
            export KOHA_PLUGIN_DIR=\$(pwd) &&
            export PERL5LIB=\$PERL5LIB:. &&
            sudo cpanm --notest TAP::Harness::JUnit &&
            JUNIT_OUTPUT_FILE=junit.xml prove -v -r -s t/ --harness=TAP::Harness::JUnit
          "

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2
        if: always()
        with:
          files: |
            junit.xml
          check_name: "Test Results (Koha ${{ env.KOHA_BRANCH }})"

      - name: Show logs on failure
        if: failure()
        run: |
          export KTD_HOME=$(pwd)/../koha-testing-docker
          echo "=== KTD instance status ==="
          ktd --name template --list || true
          echo "=== Koha error logs ==="
          ktd --name template --shell --run "tail -50 /var/log/koha/kohadev/plack-intranet-error.log" || true
          echo "=== Container logs ==="
          docker logs template-koha-1 --tail 50 || true

      - name: Cleanup KTD instance
        if: always()
        run: |
          export KTD_HOME=$(pwd)/../koha-testing-docker
          ktd --name template down || true

  release:
    needs: unit_tests
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Read package.json
        id: package
        run: |
          echo "plugin_path=$(jq -r '.plugin.pm_path' package.json)" >> $GITHUB_OUTPUT

      - name: Build Koha Plugin kpz artifact
        id: kpz
        uses: "bywatersolutions/github-action-koha-plugin-create-kpz@356e82e61de0403abd68d76b47a253f245efe1fd" # v3
        with:
          release-version: ${{ github.ref_name }}
          release-name: ${{ github.event.repository.name }}
          minimum-version: ${{ env.KOHA_IMAGE }}
          plugin-module: ${{ steps.package.outputs.plugin_path }}

      - name: Create Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: |
            ${{ steps.kpz.outputs.filename }}
            CHANGELOG.md
          generate_release_notes: true

  keepalive:
    name: Keep Alive
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Check age and push commit if needed
      run: |
        LAST_COMMIT=$( git --no-pager log -1 --format=%ct )
        NOW=$(date +%s)
        DIFF=$(($NOW-$LAST_COMMIT))
        DAYS=$(($DIFF/86400))
        git config --global user.email jacob.omara@openfifth.co.uk
        git config --global user.name "Jacob O'Mara"
        git commit --allow-empty -m "Automated commit from keep alive workflow"
        if [ "$DAYS" -gt "50" ]; then git push; fi
